gg.jte.developmentMode=${JTE_DEV_MODE:true}
gg.jte.templateLocation=src/main/jte

# In-memory H2 for debugging
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SQL_LOGGING:true}

# Security
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:tlsgur3108}

# Feature Flags
app.feature.leads.enabled=${LEADS_ENABLED:false}
app.feature.waitlist.enabled=${WAITLIST_ENABLED:true}
app.feature.monetization-hooks.enabled=${MONETIZATION_HOOKS_ENABLED:false}
app.feature.seo-debug-visible=${SEO_DEBUG_VISIBLE:false}

# Editorial trust defaults
app.content.author-name=${CONTENT_AUTHOR_NAME:RadonVerdict Data Team}
app.content.author-role=${CONTENT_AUTHOR_ROLE:Public Data and Cost Modeling}
app.content.reviewer-name=${CONTENT_REVIEWER_NAME:}
app.content.reviewer-role=${CONTENT_REVIEWER_ROLE:}
app.content.last-reviewed=${CONTENT_LAST_REVIEWED:}
app.content.privacy-last-updated=${CONTENT_PRIVACY_LAST_UPDATED:February 1, 2026}

# Site metadata (used by sitemap/robots)
app.site.base-url=${SITE_BASE_URL:https://radonverdict.com}
app.site.lastmod=${SITE_LASTMOD:}
app.site.enforce-canonical-host=${SITE_ENFORCE_CANONICAL_HOST:true}
app.site.include-unknown-sitemap=${SITE_INCLUDE_UNKNOWN_SITEMAP:false}
app.site.index-zone3-pages=${SITE_INDEX_ZONE3_PAGES:true}
app.site.recovery-only-indexing=${SITE_RECOVERY_ONLY_INDEXING:false}
app.site.priority-county-indexing=${SITE_PRIORITY_COUNTY_INDEXING:false}
app.site.index-county-cost-pages=${SITE_INDEX_COUNTY_COST_PAGES:true}
app.site.index-evidence-rich-cost-pages=${SITE_INDEX_EVIDENCE_RICH_COST_PAGES:false}
app.site.include-broad-zone-sitemap=${SITE_INCLUDE_BROAD_ZONE_SITEMAP:false}
app.site.retire-non-evidence-county-pages=${SITE_RETIRE_NON_EVIDENCE_COUNTY_PAGES:true}

# Lightweight local persistence paths (mount these on production for durability)
app.storage.leads-csv-path=${LEADS_CSV_PATH:data/leads.csv}
app.storage.telemetry-csv-path=${TELEMETRY_CSV_PATH:data/telemetry_events.csv}
app.storage.contact-csv-path=${CONTACT_CSV_PATH:data/contact_messages.csv}
app.storage.quote-ledger-csv-path=${QUOTE_LEDGER_CSV_PATH:data/quote_ledger.csv}
app.storage.search-console-query-csv-path=${SEARCH_CONSOLE_QUERY_CSV_PATH:data/search-console-query-page.csv}
app.storage.search-console-snapshot-dir=${SEARCH_CONSOLE_SNAPSHOT_DIR:data/search-console/snapshots}
app.storage.search-console-daily-query-csv-path=${SEARCH_CONSOLE_DAILY_QUERY_CSV_PATH:data/search-console/daily-query-page.csv}

# Local-only Gmail outreach. Keep these values in a local environment file, never in Git.
app.outreach.gmail.client-id=${GMAIL_OUTREACH_CLIENT_ID:}
app.outreach.gmail.client-secret=${GMAIL_OUTREACH_CLIENT_SECRET:}
app.outreach.gmail.redirect-uri=${GMAIL_OUTREACH_REDIRECT_URI:http://localhost:8080/admin/outreach/google/callback}
app.outreach.gmail.sender-email=${GMAIL_OUTREACH_SENDER_EMAIL:spainhyeok@gmail.com}
app.outreach.gmail.token-encryption-key=${GMAIL_OUTREACH_TOKEN_ENCRYPTION_KEY:}
app.outreach.gmail.token-path=${GMAIL_OUTREACH_TOKEN_PATH:data/outreach/gmail-oauth-token.enc}
app.outreach.gmail.daily-send-limit=${GMAIL_OUTREACH_DAILY_SEND_LIMIT:12}
app.outreach.csv-path=${OUTREACH_CSV_PATH:data/outreach/nova_inspector_launch.csv}

# Respect reverse-proxy headers (Cloudflare / load balancer)
server.forward-headers-strategy=framework
